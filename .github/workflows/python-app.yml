# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    # PcGoz sadece Windows'ta calisir (UI Automation, SendInput, winrt).
    runs-on: windows-latest
    env:
      # Cikti boruya gidince Python cp1252 kullanir; testler Turkce karakter basiyor.
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv flake8
        uv sync --locked
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=.venv
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=.venv
    # birim.py etkin klavye duzenini kullanir ve Turkce Q varsayar ("ş" ABD
    # duzeninde yok); runner'i gelistirici makinesiyle ayni duzene getir.
    - name: Use Turkish Q keyboard layout
      run: |
        Set-WinUserLanguageList -LanguageList tr-TR -Force
        Set-WinDefaultInputMethodOverride -InputTip "041F:0000041F"
    # Testler pytest degil, duz betik; basarisizlikta 1 ile cikarlar. Sadece girdi
    # gondermeyen ve pencere acmayanlar burada; digerleri gercek masaustu ister.
    - name: Unit tests
      run: uv run python tests/birim.py
    - name: MCP stdio test
      run: uv run python tests/mcp_istemci.py
